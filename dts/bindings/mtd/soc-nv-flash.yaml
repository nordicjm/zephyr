description: Flash node

compatible: "soc-nv-flash"

include: base.yaml

properties:
  erase-block-size:
    type: int
    description: address alignment required by flash erase operations

  write-block-size:
    type: int
    description: address alignment required by flash write operations

  flash-peripheral-dev:
    type: phandle
    description: |
      Phandle to the flash peripheral whose driver functions are used to interact with this flash
      node.
