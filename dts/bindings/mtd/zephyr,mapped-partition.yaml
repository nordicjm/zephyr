description: |
  Memory-mapped partition of a flash (or other non-volatile storage) memory.

  The ``zephyr,mapped-partition`` node should be children of the NVM memory node. Note also that
  the NVM memory node is usually different from the node representing the NVM controller IP block,
  and the NVM memory node should have a ``flash-peripheral-dev`` phandle property specifying the
  NVM peripheral device and a ``ranges`` property specifying the full range of the NVM area
  (usually the same as the ``reg`` property with a 0x0 prepended before the offset value). Nested
  ``zephyr,mapped-partition`` nodes are supported, and should have ``ranges`` properties set to
  indicate their range to their child nodes.

compatible: "zephyr,mapped-partition"

properties:
  "#address-cells":
    type: int
    default: 1
    description: |
      Number of cells required to represent a child node's reg property address. This must be
      large enough to represent the start offset of each partition. Default is chosen to support
      a 32-bit address.

  "#size-cells":
    type: int
    default: 1
    description: |
      Number of cells required to represent a child node's reg property address. This must be
      large enough to represent the size of each partition in bytes. Default is chosen to support
      a 32-bit address.

  label:
    type: string
    description: Human readable string describing the NVM partition.

  read-only:
    type: boolean
    description: Set this property if the partition is read-only

  reg:
    type: array
    required: true
    description: |
      This should be in the format <OFFSET SIZE>, where OFFSET is the offset of the flash
      partition relative to the base address of the parent memory, and SIZE is the size of the
      partition in bytes.

examples:
  - |
    &flash0 {
            flash-peripheral-dev = <&flash_interface>;
            reg = <0x00000000 DT_SIZE_K(1024)>;
            ranges = <0x0 0x00000000 DT_SIZE_K(1024)>;

            /*
             * Offsets are relative to the flash0 node, if flash0 has an address of 0x10000000 then
             * the below offset of 0x0 means address 0x10000000
             */
            boot_partition: partition@0 {
                    compatible = "zephyr,mapped-partition";
                    label = "mcuboot";
                    reg = <0x00000000 0x0000C000>;
            };

            slot0_partition: partition@c000 {
                    compatible = "zephyr,mapped-partition";
                    label = "image-0";
                    reg = <0x0000C000 0x00076000>;
            };

            slot1_partition: partition@82000 {
                    compatible = "zephyr,mapped-partition";
                    label = "image-1";
                    reg = <0x00082000 0x00076000>;
            };

            /*
             * Below example disables an NVM partition, if using the flash map subsystem
             * with the default mappings then the below partition will not be present in
             * the flash map
             */
            storage_partition: partition@f8000 {
                    compatible = "zephyr,mapped-partition";
                    label = "storage";
                    reg = <0x000f8000 0x00008000>;
                    status = "disabled";
            };
    };

    &flash1 {
            flash-peripheral-dev = <&other_flash_interface>;
            reg = <0x10000000 DT_SIZE_K(256)>;
            ranges = <0x0 0x10000000 DT_SIZE_K(256)>;

            /*
             * The 'partitions' grouping is optional, it allows for clearing all partitions in a
             * device (e.g. using a dtc overlay file) but is not required. If used, then it needs
             * a `ranges;` property and to specify the #address-cells and #size-cells properties
             */
            partitions {
                    ranges;
                    #address-cells = <1>;
                    #size-cells = <1>;

                    external_partition: partition@0 {
                            compatible = "zephyr,mapped-partition";
                            reg = <0x00000000 0x00010000>;
                    };
            };
    };
